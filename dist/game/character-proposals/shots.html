<!doctype html><meta charset="utf-8"><title>shots</title>
<style>
  html, body { background: transparent; margin: 0; }
  #stage { display: inline-flex; flex-wrap: wrap; gap: 10px 14px; padding: 12px; align-items: flex-end; max-width: var(--max, 1180px); }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  figcaption { font: 13px/1.2 ui-monospace, Menlo, monospace; color: #a89a86; text-align: center; max-width: 180px; }
  canvas { image-rendering: pixelated; display: block; }
  .grp { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .grp > b { font: 600 13px ui-monospace, Menlo, monospace; color: #d9c7a8; letter-spacing: .08em; text-transform: uppercase; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-end; }
</style>
<div id="stage"></div>
<script type="module">
// Every static 2D figure on the proposals page, one per ?shot=… — tools/capture.mjs screenshots #stage.
import { renderA } from './approaches/A-pixel-paperdoll/gen.js';
import { renderCreatureA } from './approaches/A-pixel-paperdoll/creatures.js';
import { slicesOf, renderD } from './approaches/D-spritestack/gen.js';
import { RACES, CLASSES, PROGRESSION, RARITIES, CREATURES, BASES, BIOMES, spec, SKINS, HAIRS } from './lib/data.js';
import { floorAt, wallAt } from './map/surfaces.js';
import { corners, toWorld, fromWorld } from './lib/hex.js';
import { hexToRgb } from './lib/color.js';

const q = new URLSearchParams(location.search), shot = q.get('shot') ?? 'A-races';
const stage = document.getElementById('stage');
const fig = (canvas, cap, into = stage) => { const f = document.createElement('figure'); f.append(canvas); if (cap) { const c = document.createElement('figcaption'); c.textContent = cap; f.append(c); } into.append(f); return f; };
const group = title => { const g = document.createElement('div'); g.className = 'grp'; g.innerHTML = `<b>${title}</b>`; const r = document.createElement('div'); r.className = 'row'; g.append(r); stage.append(g); return r; };
const crop = (sprite, k, top = 0) => { const c = sprite.toCanvas(k); if (!top) return c; const o = document.createElement('canvas'); o.width = c.width; o.height = c.height - top * k; o.getContext('2d').drawImage(c, 0, -top * k); return o; };
const metrics = {};

const race = (id, i = 0) => RACES.find(r => r.id === id);
const A = (s, k = 3, o = {}) => crop(renderA(s, o), k, 8);
const Dk = (s, a = 0.55, k = 3) => crop(renderD(slicesOf(s), a), k, 4);

switch (shot) {
  case 'A-races': RACES.forEach((R, i) => fig(A(spec({ race: R.id, cls: 'fighter', skin: R.skins[i % R.skins.length], hair: R.hairs ? R.hairs[0] : HAIRS[i % HAIRS.length], hairStyle: i % 4, loadout: { body: 'padded', feet: 'boots' } })), R.name)); break;
  case 'A-classes': CLASSES.forEach((C, i) => { const R = RACES[i % RACES.length]; fig(A(spec({ race: R.id, cls: C.id, skin: R.skins[0], hair: R.hairs ? R.hairs[0] : HAIRS[i % HAIRS.length], hairStyle: i % 4 })), `${C.name} · ${R.name}`); }); break;
  case 'A-progression': PROGRESSION.forEach(p => fig(A(spec({ race: 'human', cls: 'fighter', loadout: p.loadout, hairStyle: 2 })), p.label)); break;
  case 'A-rarity': RARITIES.forEach(r => fig(A(spec({ race: 'elf', cls: 'paladin', rarity: Object.fromEntries(['mainHand', 'offHand', 'body', 'head', 'hands', 'feet', 'cloak'].map(s => [s, r.id])) }), 3, { frame: 1 }), r.name)); break;
  case 'A-creatures': CREATURES.forEach(c => fig(crop(renderCreatureA(c), 3, 8), c.name)); break;
  case 'A-anim': {
    const s = spec({ race: 'halfOrc', cls: 'barbarian' }), w = spec({ race: 'elf', cls: 'ranger', hairStyle: 1 });
    const r1 = group('walk — 4 frames'); for (let f = 0; f < 4; f++) fig(A(w, 3, { anim: 'walk', frame: f }), `frame ${f}`, r1);
    const r2 = group('attack — 4 frames'); for (let f = 0; f < 4; f++) fig(A(s, 3, { anim: 'attack', frame: f }), `frame ${f}`, r2);
    const r3 = group('back, and mirrored for the other two diagonals'); fig(A(w, 3, { facing: 'back' }), 'back', r3); fig(crop(renderA(w).flipX(), 3, 8), 'front, mirrored', r3); fig(A(spec({ cls: 'paladin', race: 'dragonborn' }), 3, { facing: 'back' }), 'back · cloak', r3);
    break;
  }
  case 'A-items': {
    // every one of the 54 bases, each on the same plain body, grouped by slot
    const plain = { body: 'padded' };
    const bySlot = {}; for (const b of BASES) (bySlot[b.slot] ??= []).push(b);
    for (const [slot, list] of Object.entries(bySlot)) {
      const r = group(`${slot} · ${list.length}`);
      for (const b of list) { const lo = { ...(slot === 'body' ? {} : plain), [slot]: b.id }; fig(A(spec({ race: 'human', cls: 'fighter', loadout: lo, hairStyle: 2 }), 2), b.name, r); }
    }
    break;
  }
  case 'A-scales': {
    const s = spec({ race: 'dwarf', cls: 'cleric', rarity: { mainHand: 'rare', offHand: 'uncommon' } });
    for (const k of [1, 2, 3, 6]) fig(crop(renderA(s), k, 8), `×${k}${k === 1 ? ' — map, 1:1' : k === 6 ? ' — character sheet' : ''}`);
    break;
  }
  case 'A-random': {
    // 24 random companions from the roster generator's own skin and hair tables — no curation
    let seed = 7; const rnd = n => { seed = (seed * 16807) % 2147483647; return seed % n; };
    const bases = s => BASES.filter(b => b.slot === s);
    for (let i = 0; i < 24; i++) {
      const R = RACES[rnd(RACES.length)], C = CLASSES[rnd(CLASSES.length)];
      const lo = { ...C.loadout }; for (const sl of ['body', 'mainHand', 'head', 'feet']) if (rnd(3) === 0) { const l = bases(sl); lo[sl] = l[rnd(l.length)].id; }
      const rar = {}; for (const sl of Object.keys(lo)) rar[sl] = RARITIES[Math.min(4, rnd(9) === 0 ? 4 : rnd(4))].id;
      fig(A(spec({ race: R.id, cls: C.id, skin: R.skins[rnd(R.skins.length)], hair: R.hairs ? R.hairs[0] : HAIRS[rnd(HAIRS.length)], hairStyle: rnd(4), loadout: lo, rarity: rar }), 2), `${R.name} ${C.name}`);
    }
    break;
  }
  case 'D-turn': { const st = slicesOf(spec({ race: 'dwarf', cls: 'paladin' })); for (let i = 0; i < 8; i++) fig(crop(renderD(st, i / 8 * Math.PI * 2), 3, 4), `${i * 45}°`); break; }
  case 'D-classes': CLASSES.forEach((C, i) => { const R = RACES[i % RACES.length]; fig(Dk(spec({ race: R.id, cls: C.id, skin: R.skins[0], hair: R.hairs ? R.hairs[0] : HAIRS[i % HAIRS.length], hairStyle: i % 4 })), `${C.name} · ${R.name}`); }); break;
  case 'D-progression': PROGRESSION.forEach(p => fig(Dk(spec({ race: 'human', cls: 'fighter', loadout: p.loadout, hairStyle: 2 })), p.label)); break;
  case 'D-creatures': CREATURES.filter(c => !['quadruped', 'ooze'].includes(c.form)).forEach(c => fig(Dk({ race: { id: c.id, h: c.h, w: c.w, skins: [c.skin], bald: true, ears: 'none', snout: c.form === 'lizard', tail: c.form === 'lizard' || c.form === 'winged', horns: c.form === 'winged' ? 'curl' : null, tusks: c.form === 'brute' }, skin: c.skin, hair: '#2a2018', hairStyle: 0, primary: c.primary ?? '#4a3a2a', secondary: '#3a2a1e', loadout: c.loadout ?? {}, rarity: {}, form: c.form }), c.name)); break;
  case 'surfaces': {
    // each biome: a close-up patch of hex floor (with the grid) and a strip of its masonry
    for (const b of BIOMES) {
      const W = 150, H = 96, k = 2, cv = document.createElement('canvas'); cv.width = W; cv.height = H + 30; const g = cv.getContext('2d'), img = g.createImageData(W, H + 30);
      for (let Y = 0; Y < H; Y++) for (let X = 0; X < W; X++) {
        const x = X / 24 + 3.1, y = Y / 24 + 2.2; let c = floorAt(b, x, y);
        const [qq, rr] = fromWorld(x, y), [cx, cy] = toWorld(qq, rr);
        const d = Math.max(...[0, 1, 2].map(i => { const a = i * Math.PI / 3; return Math.abs((x - cx) * Math.cos(a) + (y - cy) * Math.sin(a)); }));
        const [r, gg, bb] = hexToRgb(c); const e = d > 0.845 ? 0.88 : 1; img.data.set([r * e, gg * e, bb * e, 255], (Y * W + X) * 4);
      }
      for (let Y = 0; Y < 26; Y++) for (let X = 0; X < W; X++) { const [r, gg, bb] = hexToRgb(wallAt(b, X / 24, (25 - Y) / 24, 26 / 24)); img.data.set([r, gg, bb, 255], ((H + 4 + Y) * W + X) * 4); }
      g.putImageData(img, 0, 0);
      const up = document.createElement('canvas'); up.width = W * k; up.height = (H + 30) * k; const ug = up.getContext('2d'); ug.imageSmoothingEnabled = false; ug.drawImage(cv, 0, 0, up.width, up.height);
      fig(up, b.name);
    }
    break;
  }
}

// timing: how long one character takes to generate, per approach, median of 40
if (q.has('time')) {
  const specs = Array.from({ length: 40 }, (_, i) => { const R = RACES[i % RACES.length], C = CLASSES[i % CLASSES.length]; return spec({ race: R.id, cls: C.id, skin: R.skins[0], hairStyle: i % 4 }); });
  const med = f => { const t = specs.map(s => { const t0 = performance.now(); f(s); return performance.now() - t0; }).sort((a, b) => a - b); return +t[20].toFixed(3); };
  metrics.A_oneFrame = med(s => renderA(s));
  metrics.A_fullSheet = med(s => { for (const facing of ['front', 'back']) for (const anim of ['idle', 'walk', 'attack']) for (let f = 0; f < 4; f++) renderA(s, { facing, anim, frame: f }); });
  metrics.D_slices = med(s => slicesOf(s));
  const st = specs.map(s => slicesOf(s)); let i = 0;
  metrics.D_oneAngle = med(() => renderD(st[i++ % st.length], 0.5));
}
window.__metrics = metrics;
</script>
