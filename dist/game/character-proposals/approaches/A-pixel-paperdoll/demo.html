<!doctype html><meta charset="utf-8"><title>A · pixel paper-doll</title>
<style>body{background:#1a1612;color:#ddd;font:14px monospace;margin:16px}canvas{image-rendering:pixelated;margin:2px;background:#2a241e}.row{display:flex;flex-wrap:wrap;align-items:end;gap:6px;margin-bottom:12px}figure{margin:0;text-align:center}figcaption{font-size:11px}</style>
<div id=out></div>
<script type=module>
import { renderA } from './gen.js';
import { RACES, CLASSES, PROGRESSION, spec, RARITIES } from '../../lib/data.js';
const out = document.getElementById('out');
const row = (title, items) => { const h = document.createElement('h3'); h.textContent = title; out.append(h); const r = document.createElement('div'); r.className = 'row'; for (const [cap, s, o] of items) { const f = document.createElement('figure'); f.append(renderA(s, o).toCanvas(4)); const c = document.createElement('figcaption'); c.textContent = cap; f.append(c); r.append(f); } out.append(r); };
row('Races (fighter kit)', RACES.map((r, i) => [r.name, spec({ race: r.id, cls: 'fighter', hairStyle: i % 4, skin: r.skins[i % r.skins.length] })]));
row('Classes (human)', CLASSES.map((c, i) => [c.name, spec({ race: 'human', cls: c.id, hairStyle: i % 4, skin: RACES[0].skins[i % 5] })]));
row('Progression', PROGRESSION.map(p => [p.label, spec({ race: 'dwarf', cls: 'fighter', loadout: p.loadout })]));
row('Rarity', RARITIES.map(r => [r.name, spec({ race: 'elf', cls: 'paladin', rarity: { mainHand: r.id, body: r.id, offHand: r.id, head: r.id } })]));
row('Walk / back', [0,1,2,3].map(f => ['walk ' + f, spec({ cls: 'ranger' }), { anim: 'walk', frame: f }]).concat([0,1,2,3].map(f => ['atk ' + f, spec({ cls: 'barbarian', race: 'halfOrc' }), { anim: 'attack', frame: f }]), [['back', spec({ cls: 'paladin' }), { facing: 'back' }], ['back', spec({ cls: 'wizard', hairStyle: 1 }), { facing: 'back' }]]));
</script>
