<!doctype html><meta charset="utf-8"><style>body{background:#1a1612;color:#ccc;font:12px monospace;margin:8px}canvas{image-rendering:pixelated;background:#2a241e;margin:2px}</style>
<div id=out></div>
<script type=module>
import { bake } from './bake.js';
import { spec } from '../../lib/data.js';
const q = new URLSearchParams(location.search), kind = q.get('k') ?? 'C';
const s = spec({ cls: q.get('c') ?? 'paladin', race: q.get('r') ?? 'dwarf' });
const a = bake(s, kind), b = bake(s, kind);
const out = document.getElementById('out');
out.append(Object.assign(document.createElement('div'), { textContent: `${kind}: first bake ${a.ms.toFixed(1)} ms (32 frames) · cached ${b.ms.toFixed(3)} ms` }));
const c = a.atlas; c.style.width = c.width * 2 + 'px'; out.append(c);
window.__metrics = { kind, bake: a.ms, cached: b.ms };
</script>
