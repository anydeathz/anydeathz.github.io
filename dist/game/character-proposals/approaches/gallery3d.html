<!doctype html><meta charset="utf-8"><meta name="color-scheme" content="dark"><title>3D gallery</title>
<style>html,body{background:transparent;margin:0}canvas{display:block;image-rendering:pixelated}</style>
<script type=module>
// One page renders B (voxel) or C (pixel-3D) rows, so both are judged under the same camera and light.
//   ?k=B|C &m=classes|races|progression|rarity|creatures|items &px=pixel size &a=idle|walk|attack
import * as THREE from '../vendor/three.module.js';
import { voxelCharacter, animate } from './B-voxel/mesh.js';
import { buildC } from './C-pixel3d/gen.js';
import { spec, RACES, CLASSES, PROGRESSION, RARITIES, CREATURES, BASES } from '../lib/data.js';
const q = new URLSearchParams(location.search), mode = q.get('m') ?? 'classes', kind = q.get('k') ?? 'B';
const W = Number(q.get('w') ?? 1200), H = Number(q.get('h') ?? 300), px = Number(q.get('px') ?? 2);
const r = new THREE.WebGLRenderer({ antialias: false, alpha: true }); r.setPixelRatio(1 / px); r.setSize(W, H); r.domElement.style.width = W + 'px'; r.domElement.style.height = H + 'px';
document.body.append(r.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#e8eef2', '#4a3a2a', kind === 'C' ? 1.3 : 1.6)); const sun = new THREE.DirectionalLight('#fff0d8', kind === 'C' ? 2.4 : 2.6); sun.position.set(2, 5, 6); scene.add(sun);
const creatureSpec = c => ({ race: { id: c.id, h: c.h, w: c.w, skins: [c.skin], bald: true, ears: c.form === 'brute' ? 'small' : 'none', snout: c.form === 'lizard', tail: c.form === 'lizard' || c.form === 'winged', horns: c.form === 'winged' ? 'curl' : null, tusks: c.form === 'brute' }, skin: c.skin, hair: '#2a2018', hairStyle: 0, primary: c.primary ?? '#4a3a2a', secondary: '#3a2a1e', loadout: c.loadout ?? {}, rarity: {}, form: c.form });
const ITEMS = q.get('items') ? q.get('items').split(',') : null;
const list = mode === 'races' ? RACES.map((R, i) => spec({ race: R.id, cls: 'fighter', skin: R.skins[i % R.skins.length], hairStyle: i % 4, loadout: { body: 'padded', feet: 'boots' } }))
  : mode === 'progression' ? PROGRESSION.map(p => spec({ race: 'dwarf', loadout: p.loadout }))
  : mode === 'rarity' ? RARITIES.map(x => spec({ race: 'elf', cls: 'paladin', rarity: { mainHand: x.id, body: x.id, offHand: x.id, head: x.id, feet: x.id, hands: x.id } }))
  : mode === 'creatures' ? CREATURES.filter(c => !['quadruped', 'ooze'].includes(c.form)).map(creatureSpec)
  : mode === 'items' ? ITEMS.map(id => { const b = BASES.find(x => x.id === id); return spec({ race: 'human', cls: 'fighter', loadout: { [b.slot === 'ring' ? 'ring' : b.slot]: id, ...(b.slot !== 'body' ? { body: 'padded' } : {}) } }); })
  : mode === 'one' ? [spec(JSON.parse(q.get('s')))]
  : CLASSES.map((c, i) => spec({ cls: c.id, race: RACES[i % RACES.length].id, skin: RACES[i % RACES.length].skins[0], hairStyle: i % 4 }));
const n = list.length, span = Number(q.get('span') ?? 1.3), half = n * span / 2;
const cam = new THREE.OrthographicCamera(-half, half, half * H / W, -half * H / W, 0.1, 100);
const dir = new THREE.Vector3(0.55, 0.62, 1).normalize(), right = new THREE.Vector3(1, 0, -0.55).normalize();
cam.position.copy(dir.clone().multiplyScalar(20)).add(new THREE.Vector3(0, 0.95, 0)); cam.lookAt(0, 0.95, 0); cam.updateProjectionMatrix();
const chars = list.map((s, i) => { const c = kind === 'C' ? buildC(s) : voxelCharacter(s); c.position.copy(right.clone().multiplyScalar((i - (n - 1) / 2) * span)); c.rotation.y = Number(q.get('ry') ?? -0.15); scene.add(c); return c; });
window.__metrics = { kind, ms: chars.map(c => +c.userData.ms.toFixed(2)), quads: chars.map(c => c.userData.quads ?? 0) };
const anim = q.get('a') ?? 'idle';
const tick = t => { chars.forEach((c, i) => animate(c, anim, t / 1000 + i * 0.3)); r.render(scene, cam); window.__calls = r.info.render.calls; if (!q.has('still')) requestAnimationFrame(tick); };
tick(500);
</script>
