<!doctype html><meta charset="utf-8"><title>B · voxel</title>
<style>body{background:#1a1612;margin:0}canvas{display:block;image-rendering:pixelated}</style>
<script type=module>
import * as THREE from '../../vendor/three.module.js';
import { voxelCharacter, animate } from './mesh.js';
import { spec, RACES, CLASSES, PROGRESSION, RARITIES } from '../../lib/data.js';
const q = new URLSearchParams(location.search), mode = q.get('m') ?? 'classes';
const W = Number(q.get('w') ?? 1400), H = Number(q.get('h') ?? 520), px = Number(q.get('px') ?? 2);
const r = new THREE.WebGLRenderer({ antialias: false }); r.setPixelRatio(1 / px); r.setSize(W, H); r.domElement.style.width = W + 'px'; r.domElement.style.height = H + 'px';
document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a241e');
scene.add(new THREE.HemisphereLight('#e8eef2', '#4a3a2a', 1.6)); const sun = new THREE.DirectionalLight('#fff0d8', 2.6); sun.position.set(2, 5, 6); scene.add(sun);
const list = mode === 'races' ? RACES.map((R, i) => spec({ race: R.id, cls: 'fighter', skin: R.skins[i % R.skins.length], hairStyle: i % 4 }))
  : mode === 'progression' ? PROGRESSION.map(p => spec({ race: 'dwarf', loadout: p.loadout }))
  : mode === 'rarity' ? RARITIES.map(x => spec({ race: 'elf', cls: 'paladin', rarity: { mainHand: x.id, body: x.id, offHand: x.id, head: x.id } }))
  : CLASSES.map((c, i) => spec({ cls: c.id, race: RACES[i % RACES.length].id, skin: RACES[i % RACES.length].skins[0], hairStyle: i % 4 }));
const n = list.length, span = 1.25;
const cam = new THREE.OrthographicCamera(-n * span / 2, n * span / 2, (n * span / 2) * H / W, -(n * span / 2) * H / W, 0.1, 100);
const dir = new THREE.Vector3(0.55, 0.62, 1).normalize(), right = new THREE.Vector3(1, 0, -0.55).normalize();
cam.position.copy(dir.clone().multiplyScalar(20)).add(new THREE.Vector3(0, 0.95, 0)); cam.lookAt(0, 0.95, 0); cam.updateProjectionMatrix();
const chars = list.map((s, i) => { const c = voxelCharacter(s); c.position.copy(right.clone().multiplyScalar((i - (n - 1) / 2) * span)); c.rotation.y = -0.15; scene.add(c); return c; });
window.__metrics = { ms: chars.map(c => c.userData.ms), quads: chars.map(c => c.userData.quads) };
console.log(JSON.stringify(window.__metrics));
const anim = q.get('a') ?? 'idle';
const tick = t => { chars.forEach((c, i) => animate(c, anim, t / 1000 + i * 0.3)); r.render(scene, cam); if (!q.has('still')) requestAnimationFrame(tick); };
tick(500);
</script>
