<!doctype html><meta charset="utf-8"><style>body{background:#1a1612;margin:8px}canvas{image-rendering:pixelated;margin:1px;background:#2a241e}</style>
<div id=out></div>
<script type=module>
import { slicesOf, renderD } from './gen.js';
import { spec, CLASSES, RACES } from '../../lib/data.js';
const out = document.getElementById('out'), k = 4;
const stack = slicesOf(spec({ cls: 'paladin', race: 'dwarf' }));
for (let i = 0; i < 8; i++) out.append(renderD(stack, i / 8 * Math.PI * 2).toCanvas(k));
out.append(document.createElement('br'));
for (const [i, c] of CLASSES.slice(0, 8).entries()) out.append(renderD(slicesOf(spec({ cls: c.id, race: RACES[i].id, skin: RACES[i].skins[0], hairStyle: i % 4 })), 0.5).toCanvas(k));
</script>
