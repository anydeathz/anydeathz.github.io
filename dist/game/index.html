    <!--
      Three faces, three jobs (12-art-direction/typography-and-palette Q1, which explicitly
      reopened the display face: "the period face may read as too austere for a game with
      fireballs in it"):

        IM Fell English — display, and DISPLAY ONLY AT 20px AND ABOVE. A genuine
                          17th-century English face whose irregular inking is the point:
                          it looks pressed rather than rendered. The build this replaces
                          set 10px tracked-out ALL-CAPS blackletter section headings,
                          which is why Record and Options were close to unreadable.
        Cardo           — everything below 20px. A scholar's face built for medievalists,
                          with real italics and real small caps, and it holds at 13px.
        Courier Prime   — every numeral. Struck rather than drawn, which suits a game
                          whose first pillar is an honest log. Tabular figures are not a
                          preference: without them stat rows jitter horizontally as values
                          change and the UI reads as noise.
    -->
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cardo:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
